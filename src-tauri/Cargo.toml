[package]
name = "parapper"
version = "0.5.0"
description = "YukariNet and Yukari Connect NEO ASR bridge"
authors = ["Parakeet"]
license = "MIT"
repository = ""
edition.workspace = true
rust-version.workspace = true
default-run = "parapper"
autobins = false

[lints]
workspace = true

[features]
real-asr-tests = ["parapper-models/real-asr-tests"]
# Off by default; never part of the shipped application. Used by the
# diagnostics package's streaming_recognition_smoke_server binary, which runs
# the streaming recognition WebSocket server against a deterministic fake
# recognition backend for external protocol-client end-to-end tests.
smoke-server = ["parapper-stt-server/smoke-server"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "parapper"
path = "src/main.rs"

[[test]]
name = "jvs_asr"
path = "tests/jvs_asr.rs"
required-features = ["real-asr-tests"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow = { workspace = true }
parapper-models = { path = "../crates/parapper-models", features = ["native-models"] }
parapper-stt-engine = { path = "../crates/parapper-stt-engine" }
parapper-stt-server = { path = "../crates/parapper-stt-server" }
bzip2 = "0.4.4"
chrono = { workspace = true }
cpal = "0.17.3"
dasp_sample = "0.11.0"
log = { workspace = true }
ort = { version = "=2.0.0-rc.12", features = ["load-dynamic"] }
reqwest = { workspace = true }
rubato = "1.0.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }
tar = "0.4.44"
tokio = { workspace = true }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
zstd = "0.13"
tungstenite = "0.29.0"

[dev-dependencies]
hound = "3.5.1"
tauri = { workspace = true, features = ["test"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.19.0"

# System Audio Recording (kTCCServiceAudioCapture) permission for CoreAudio
# loopback capture. cpal builds the process tap but records silence without this
# permission, and macOS never auto-prompts, so we request it via the private TCC
# framework (mirroring RustAudio/cpal#1257). These crates are already in the tree
# transitively via cpal, so no new versions are pulled in.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libloading = "0.7"
objc2-core-foundation = "0.3"
