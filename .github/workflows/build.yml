name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: 1.97.1
      TARGET_TRIPLE: x86_64-pc-windows-msvc
      ONNXRUNTIME_VERSION: 1.24.4
      ONNXRUNTIME_PREBUILT_DIR: onnxruntime-win-x64-1.24.4
      ONNXRUNTIME_PREBUILT_URL: https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-win-x64-1.24.4.zip
      ONNXRUNTIME_PREBUILT_SIZE: 74442783
      ONNXRUNTIME_PREBUILT_SHA256: d2319fddfb6ea4db99ccc4b60c85c517bcd855721f5daa6a06d40d7cb2ee2357
      ONNXRUNTIME_DLL_SIZE: 14203464
      ONNXRUNTIME_DLL_SHA256: b95efb2113b603bbbf3f191061c5516a871ed546893c820e4f3b7b6c358dbf2a
      ONNXRUNTIME_PROVIDERS_SHARED_DLL_SIZE: 22088
      ONNXRUNTIME_PROVIDERS_SHARED_DLL_SHA256: f2540b89707b47895c2a732bfd04e34a695c580d22301ef44c0f01f09b001673

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.10.0
          cache: pnpm

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION
          rustup default $env:RUST_VERSION
          rustup target add $env:TARGET_TRIPLE
          rustup component add rustfmt clippy --toolchain $env:RUST_VERSION

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ env.TARGET_TRIPLE }}
          cache-on-failure: true

      - name: Cache Microsoft ONNX Runtime DLLs
        id: onnxruntime-cache
        uses: actions/cache@v4
        with:
          path: target/onnxruntime-prebuilt
          key: onnxruntime-${{ env.ONNXRUNTIME_VERSION }}-${{ env.TARGET_TRIPLE }}-${{ env.ONNXRUNTIME_PREBUILT_SHA256 }}

      - name: Download Microsoft ONNX Runtime DLLs
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'target/onnxruntime-prebuilt'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'onnxruntime-win-x64.zip'
          curl.exe -L -f -o $archive $env:ONNXRUNTIME_PREBUILT_URL
          if ((Get-Item -LiteralPath $archive).Length -ne [int64]$env:ONNXRUNTIME_PREBUILT_SIZE) {
            Write-Error "Unexpected Microsoft ONNX Runtime archive size"
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ONNXRUNTIME_PREBUILT_SHA256) {
            Write-Error "Unexpected Microsoft ONNX Runtime archive digest"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $libDir = Join-Path $destination "$env:ONNXRUNTIME_PREBUILT_DIR/lib"
          if (!(Test-Path $libDir)) {
            Write-Error "Microsoft ONNX Runtime DLL dir not found: $libDir"
          }

      - name: Verify Microsoft ONNX Runtime identity
        shell: pwsh
        run: |
          $libDir = Join-Path $env:GITHUB_WORKSPACE "target/onnxruntime-prebuilt/$env:ONNXRUNTIME_PREBUILT_DIR/lib"
          $libraries = @(
            @{ Name = 'onnxruntime.dll'; Size = [int64]$env:ONNXRUNTIME_DLL_SIZE; Sha256 = $env:ONNXRUNTIME_DLL_SHA256 },
            @{ Name = 'onnxruntime_providers_shared.dll'; Size = [int64]$env:ONNXRUNTIME_PROVIDERS_SHARED_DLL_SIZE; Sha256 = $env:ONNXRUNTIME_PROVIDERS_SHARED_DLL_SHA256 }
          )
          foreach ($library in $libraries) {
            $path = Join-Path $libDir $library.Name
            if (!(Test-Path -LiteralPath $path)) {
              Write-Error "$($library.Name) not found: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -ne $library.Size) {
              Write-Error "Unexpected $($library.Name) size"
            }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $library.Sha256) {
              Write-Error "Unexpected $($library.Name) digest"
            }
          }

      - name: Cache cargo-about
        id: cargo-about-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/bin/cargo-about.exe
            ~/.cargo/.crates2.json
            ~/.cargo/.crates.toml
          key: cargo-about-${{ runner.os }}-rust-${{ env.RUST_VERSION }}-v0.6.6

      - name: Install cargo-about
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.6.6 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --workspace --all-targets --all-features

      - name: STT crate dependency boundaries
        shell: pwsh
        run: |
          $workspaceTree = cargo tree --workspace
          $sherpaDependencies = $workspaceTree | Select-String -Pattern '^[\s│├└─]*sherpa-onnx(?:-sys)?\s+v'
          if ($sherpaDependencies) {
            $sherpaDependencies | Write-Output
            Write-Error 'The workspace must not depend on sherpa-onnx'
          }
          $pattern = '^[\s│├└─]*(?:tauri(?:-[^\s]+)?|ort(?:-[^\s]+)?|sherpa-onnx(?:-sys)?|vibrato(?:-rkyv)?|cpal|tokio(?:-[^\s]+)?|reqwest)\s+v'
          foreach ($package in @('parapper-stt-engine', 'parapper-stt-server')) {
            $tree = cargo tree -p $package
            $forbidden = $tree | Select-String -Pattern $pattern
            if ($forbidden) {
              $forbidden | Write-Output
              Write-Error "$package contains a forbidden host, runtime, or model dependency"
            }
          }

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Compile real ASR contracts
        run: cargo test -p parapper-models --features real-asr-tests --test real_models --no-run

      - name: Frontend lint
        run: pnpm exec eslint ./src

      - name: Frontend tests
        run: pnpm test:frontend

      - name: Tauri-free web preview
        shell: pwsh
        run: |
          pnpm build:web-preview
          $matches = Get-ChildItem -LiteralPath dist-web-preview -Recurse -File | Select-String -Pattern '@tauri-apps|__TAURI_INTERNALS__'
          if ($matches) {
            $matches | Write-Output
            Write-Error 'Tauri code leaked into web preview bundle'
          }

      - name: Frontend build
        run: pnpm build

      - name: Build MSI
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ env.TARGET_TRIPLE }} --bundles msi
          includeDebug: false
          includeRelease: true

      - name: Collect MSI paths
        id: msi
        shell: pwsh
        run: |
          $paths = Get-ChildItem -Path target -Recurse -Filter '*.msi' | ForEach-Object { $_.FullName }
          if (!$paths) {
            Write-Error 'No MSI artifacts were produced.'
          }
          "paths<<EOF" >> $env:GITHUB_OUTPUT
          $paths >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: parapper-msi-${{ github.sha }}
          path: ${{ steps.msi.outputs.paths }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.msi.outputs.paths }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
