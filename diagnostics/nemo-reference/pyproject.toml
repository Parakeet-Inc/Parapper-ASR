[project]
name = "parapper-nemo-reference"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "huggingface-hub[hf-xet]==0.36.0",
  "nemo-toolkit[asr] @ git+https://github.com/NVIDIA/NeMo.git@b331a34885986ec879ca7acb62d955e7af71c015",
  "numpy==2.3.4",
  "onnxruntime==1.24.4",
  "soundfile==0.13.1",
  "torch==2.12.0+cpu ; sys_platform != 'darwin'",
  "torch==2.12.0 ; sys_platform == 'darwin'",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
